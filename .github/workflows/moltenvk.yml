
name: moltenvk

on:
  push:
    branches:
      - moltenvk
  pull_request: {}
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: maxim-lobanov/setup-xcode@v1.5.1
        with:
          xcode-version: latest-stable

      - name: Checkout RT MoltenVK
        run: |
          git clone https://github.com/dttdrv/MoltenVK.git MoltenVK-RT
          cd MoltenVK-RT
          git checkout 176926b4eb7b6bd70f46a59f277b4417dd235f67

      - name: Checkout SPIRV-Cross
        run: |
          git clone https://github.com/dttdrv/SPIRV-Cross.git SPIRV-Cross
          git -C SPIRV-Cross checkout c1af57390a0dd4950af578ec2135120ac218806f

      - name: Fetch MoltenVK dependencies
        run: |
          cd MoltenVK-RT
          ./fetchDependencies \
            --macos --iossim --tvossim --ios --tvos \
            --spirv-cross-root "$GITHUB_WORKSPACE/SPIRV-Cross"

          # Verify the Xcode project can find the expected source.
          test -f External/SPIRV-Cross/spirv_reflect.cpp

      - name: Build MoltenVK
        run: |
          cd MoltenVK-RT

          xcodebuild build -quiet \
            -project MoltenVKPackaging.xcodeproj \
            -scheme "MoltenVK Package (iOS only)" \
            -destination "generic/platform=iOS Simulator" \
            -configuration Release

          xcodebuild build -quiet \
            -project MoltenVKPackaging.xcodeproj \
            -scheme "MoltenVK Package (tvOS only)" \
            -destination "generic/platform=tvOS Simulator" \
            -configuration Release

          xcodebuild build -quiet \
            -project MoltenVKPackaging.xcodeproj \
            -scheme "MoltenVK Package (iOS only)" \
            -configuration Release

          xcodebuild build -quiet \
            -project MoltenVKPackaging.xcodeproj \
            -scheme "MoltenVK Package (tvOS only)" \
            -configuration Release

          xcodebuild build -quiet \
            -project MoltenVKPackaging.xcodeproj \
            -scheme "MoltenVK Package (macOS only)" \
            -configuration Release

          touch -r README.md Package/Release/MoltenVK/include/MoltenVK/*
          touch -r README.md Package/Release/MoltenVK/include/vk_video/*
          touch -r README.md Package/Release/MoltenVK/include/vulkan/*

          tar -cJf ../moltenvk-rt.tar.xz \
            -C Package/Release/MoltenVK .

      - name: Upload MoltenVK
        uses: ncipollo/release-action@v1.11.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: moltenvk-rt.tar.xz
          tag: "moltenvk"
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          allowUpdates: true
          prerelease: true
